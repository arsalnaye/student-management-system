# ---------------------------------------------------------------------------
#  Database settings for the Student Management System.
#
#  This file is read at start-up. Nothing here requires a recompile, so the
#  same build runs against SQLite or MySQL.
#
#  Keys:
#    db.url      JDBC url. The dialect is inferred from it unless db.dialect
#                is set explicitly.
#    db.user     database user  (leave empty for SQLite)
#    db.password database password (leave empty for SQLite)
#    db.driver   optional driver class. JDBC 4 finds drivers on the classpath
#                by itself, so this is only needed for older setups.
#    db.dialect  optional override: sqlite or mysql
# ---------------------------------------------------------------------------

# --- SQLite (default: no server, no install, the file is created on first run)
db.url=jdbc:sqlite:data/students.db
db.user=
db.password=

# --- MySQL: comment out the three SQLite lines above, uncomment these four,
#     put mysql-connector-j-<version>.jar in lib/, and create the schema with:
#         CREATE DATABASE student_db CHARACTER SET utf8mb4;
#     The student table itself is created automatically on first run.
#
# db.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC
# db.user=root
# db.password=your_password
# db.driver=com.mysql.cj.jdbc.Driver
